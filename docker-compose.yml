services:
  chroma:
    image: chromadb/chroma:1.5.9
    container_name: video-embeddings-chroma
    ports:
      - "8806:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v2/heartbeat')"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  chroma_data:
